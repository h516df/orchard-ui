name: Validate adapters
on:
  pull_request:
  workflow_dispatch:
    inputs:
      adapter:
        description: Adapter to validate (quick runs shared policy only)
        type: choice
        default: quick
        options: [quick, android, flutter, react-native, web, all]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash cloud/check.sh quick
  android:
    if: github.event_name == 'workflow_dispatch' && (inputs.adapter == 'android' || inputs.adapter == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android toolchain
        run: bash cloud/setup.sh
      - run: bash cloud/check.sh android
  flutter:
    if: github.event_name == 'workflow_dispatch' && (inputs.adapter == 'flutter' || inputs.adapter == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth=1 --branch 3.41.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 2c9eb20739dfec95e2c74bd3dfa4601b0a8a36aa
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: bash cloud/check.sh flutter
  react-native:
    if: github.event_name == 'workflow_dispatch' && (inputs.adapter == 'react-native' || inputs.adapter == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: adapters/react-native/package-lock.json
      - working-directory: adapters/react-native
        run: npm ci
      - run: bash cloud/check.sh react-native
  web:
    if: github.event_name == 'workflow_dispatch' && (inputs.adapter == 'web' || inputs.adapter == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash cloud/check.sh web
